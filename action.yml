name: Discord Status
description: Post GitHub Actions CI status to Discord
author: iShark5060

inputs:
  webhook:
    description: Discord webhook endpoint. If not set, env.DISCORD_WEBHOOK will be used.
    required: false
  status:
    description: Job or workflow conclusion. Ignored when job_results is set. Accepts success, failure, cancelled, skipped, timed_out, action_required, neutral, stale.
    required: false
    default: ${{ job.status }}
  job_results:
    description: Comma- or newline-separated job conclusions (e.g. from needs.*.result). Literal `\n` from join(..., '\n') is also accepted. When set, the worst result becomes status and overrides the status input.
    required: false
  job:
    description: Deprecated. Job name included in message title. Same as title input.
    required: false
  content:
    description: Content shown as a message outside of the embed (use for @mentions).
    required: false
  content_on_failure:
    description: Alternate content used when status is failure-like (failure, timed_out, action_required). Useful with mention_on=failure.
    required: false
  mention_on:
    description: When to include content / content_on_failure. One of always, failure, never. Default always.
    required: false
    default: always
  title:
    description: String included in embed title. Overrides job input.
    required: false
    default: ${{ github.workflow }}
  description:
    description: Description included in message
    required: false
  image:
    description: Image attached to the message
    required: false
  color:
    description: Overrides Discord embed color
    required: false
  url:
    description: URL to jump when the title is clicked. Defaults to the workflow run URL.
    required: false
  username:
    description: Overrides Discord webhook username
    required: false
  avatar_url:
    description: Overrides Discord webhook avatar url
    required: false
  nofail:
    description: This action won't make workflow failed by default.
    required: false
    default: 'true'
  nocontext:
    description: Suppress GitHub context fields
    required: false
    default: 'false'
  noprefix:
    description: Avoid appending job status to title
    required: false
    default: 'false'
  nodetail:
    description: Suppress detailed embed fields
    required: false
    default: 'false'
  notimestamp:
    description: Avoid appending timestamp
    required: false
    default: 'false'
  ack_no_webhook:
    description: Suppress error which raised when webhook is not set
    required: false
    default: 'false'
  allowed_mentions:
    description: Optional JSON object passed through as Discord allowed_mentions. When omitted, user IDs found in content are allowed automatically.
    required: false

outputs:
  payload:
    description: Discord webhook payload (always set, even when delivery fails)

runs:
  using: node24
  main: dist/index.js

branding:
  color: blue
  icon: send
