name: Release

permissions:
  contents: read

env:
  NODE_VERSION: 26

on:
  release:
    types: [published]

jobs:
  build-and-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Record source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          require-lockfile: true

      - name: Build action
        run: pnpm run build

      - name: Verify action bundle
        run: node --check dist/index.js

      - name: Attest action.yml
        uses: actions/attest@v4
        with:
          subject-path: action.yml

      - name: Attest dist/index.js
        uses: actions/attest@v4
        with:
          subject-path: dist/index.js

      - name: Publish to release tag
        uses: iShark5060/actions-build-and-tag@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Push source tag
        shell: bash
        run: |
          TAGNAME="${{ github.event.release.tag_name }}-src"
          git tag "$TAGNAME" "${{ steps.source.outputs.sha }}"
          git push origin "$TAGNAME"

  e2e:
    needs: build-and-tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os:
          - ubuntu-slim
          - ubuntu-latest
          - ubuntu-24.04
          - ubuntu-22.04
          - windows-latest
          - windows-2025
          - windows-2022
          - ubuntu-24.04-arm
          - ubuntu-22.04-arm
          - windows-11-arm
          - macos-15-intel
          - macos-latest
          - macos-14
          - macos-15
          - macos-26

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Run action
        uses: ./
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: success
          content: '<@${{ secrets.DISCORD_USERID }}>'
          title: e2e - ${{ github.event.release.tag_name }} - ${{ matrix.os }}
          description: |
            Tag: `${{ github.event.release.tag_name }}`
            Build artifact SHA: `${{ github.sha }}`
          nofail: false
          image: https://user-images.githubusercontent.com/33576079/81886735-69e03f80-95d8-11ea-8828-fa10dda8afd1.png
          color: 0xFFFFFF
          username: GitHub Actions
          avatar_url: ${{ secrets.AVATAR_URL }}
          ack_no_webhook: true

  notify:
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read

    steps:
      - name: Resolve workflow conclusion
        uses: actions/github-script@v9
        id: conclusion
        with:
          script: |
            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            })
            const conclusions = jobs.jobs.map(j => j.conclusion).filter(Boolean)
            const priority = ['failure', 'timed_out', 'cancelled', 'action_required', 'neutral', 'success', 'skipped', 'stale']
            const conclusion = priority.find(p => conclusions.includes(p)) ?? (conclusions.length ? conclusions[0] : 'success')
            core.setOutput('conclusion', conclusion)

      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Send Discord notification
        uses: ./
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ steps.conclusion.outputs.conclusion }}
          title: ${{ github.workflow }} - conclusion
          content: '<@${{ secrets.DISCORD_USERID }}>'
          ack_no_webhook: true
