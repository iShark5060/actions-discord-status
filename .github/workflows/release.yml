name: Release

permissions:
  contents: read

env:
  NODE_VERSION: 26

on:
  release:
    types: [published]

jobs:
  build-and-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Record source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          require-lockfile: true

      - name: Build action
        run: pnpm run build

      - name: Verify action bundle
        run: node --check dist/index.cjs

      - name: Attest action.yml
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: action.yml

      - name: Attest dist/index.cjs
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/index.cjs

      - name: Publish to release tag
        uses: iShark5060/actions-build-and-tag@40966d23c6ad8d7361c2d7964d42746f7bb06286 # v1.2.1
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Push source tag
        shell: bash
        run: |
          TAGNAME="${{ github.event.release.tag_name }}-src"
          git tag "$TAGNAME" "${{ steps.source.outputs.sha }}"
          git push origin "$TAGNAME"

  sync-tags:
    needs: build-and-tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: git.darkavianlabs.com

      - name: Push release tags to Forgejo
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_REPO: shark5060/actions-discord-status
          TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$FORGEJO_TOKEN" ]; then
            echo "FORGEJO_TOKEN is empty."
            exit 1
          fi
          if [ -z "$TAG" ]; then
            echo "Release tag is empty."
            exit 1
          fi

          has_tag() {
            git ls-remote origin "refs/tags/$1" | grep -q .
          }

          refs=()
          add_tag() {
            git fetch --force origin "refs/tags/$1:refs/tags/$1"
            refs+=("refs/tags/$1:refs/tags/$1")
          }

          if ! has_tag "$TAG"; then
            echo "Release tag ${TAG} is not on GitHub."
            exit 1
          fi
          add_tag "$TAG"

          if has_tag "${TAG}-src"; then
            add_tag "${TAG}-src"
          fi

          if [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            for name in "v${BASH_REMATCH[1]}" "v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"; do
              if has_tag "$name"; then
                add_tag "$name"
              fi
            done
          fi

          git -c "http.extraHeader=AUTHORIZATION: token ${FORGEJO_TOKEN}" \
            push --force "https://git.darkavianlabs.com/${FORGEJO_REPO}.git" "${refs[@]}"

  e2e:
    needs: build-and-tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os:
          - ubuntu-slim
          - ubuntu-latest
          - ubuntu-24.04
          - ubuntu-22.04
          - windows-latest
          - windows-2025
          - windows-2022
          - ubuntu-24.04-arm
          - ubuntu-22.04-arm
          - windows-11-arm
          - macos-15-intel
          - macos-latest
          - macos-14
          - macos-15
          - macos-26

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Run action
        uses: ./
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: success
          content: '<@${{ secrets.DISCORD_USERID }}>'
          title: e2e - ${{ github.event.release.tag_name }} - ${{ matrix.os }}
          description: |
            Tag: `${{ github.event.release.tag_name }}`
            Build artifact SHA: `${{ github.sha }}`
          nofail: false
          image: https://user-images.githubusercontent.com/33576079/81886735-69e03f80-95d8-11ea-8828-fa10dda8afd1.png
          color: 0xFFFFFF
          username: GitHub Actions
          avatar_url: ${{ secrets.AVATAR_URL }}
          ack_no_webhook: true

  notify:
    needs: [e2e, sync-tags]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read

    steps:
      - name: Resolve workflow conclusion
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: conclusion
        with:
          script: |
            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            })
            const conclusions = jobs.jobs.map(j => j.conclusion).filter(Boolean)
            const priority = ['failure', 'timed_out', 'cancelled', 'action_required', 'neutral', 'success', 'skipped', 'stale']
            const conclusion = priority.find(p => conclusions.includes(p)) ?? (conclusions.length ? conclusions[0] : 'success')
            core.setOutput('conclusion', conclusion)

      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Send Discord notification
        uses: ./
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ steps.conclusion.outputs.conclusion }}
          title: ${{ github.workflow }} - conclusion
          content: '<@${{ secrets.DISCORD_USERID }}>'
          ack_no_webhook: true
